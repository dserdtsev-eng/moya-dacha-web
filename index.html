<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СНТ Надежда</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Экран загрузки -->
        <div id="loading" class="screen active">
            <div class="spinner"></div>
            <p>Загрузка данных...</p>
        </div>

        <!-- Экран входа -->
        <div id="login-screen" class="screen">
            <h1>СНТ «Надежда»</h1>
            <p class="subtitle">Личный кабинет садовода</p>
            
            <div class="form-group">
                <label>Улица</label>
                <select id="street-select"></select>
            </div>
            
            <div class="form-group">
                <label>Дом</label>
                <select id="house-select"></select>
            </div>
            
            <div class="form-group">
                <label>Пароль (4 цифры)</label>
                <input type="password" id="password-input" inputmode="numeric" maxlength="4" placeholder="••••">
            </div>
            
            <button id="login-btn">Войти</button>
            <p id="login-error" class="error"></p>
        </div>

        <!-- Экран дашборда -->
        <div id="dashboard-screen" class="screen">
            <header>
                <h2 id="user-title">Участок</h2>
                <button id="logout-btn">Выйти</button>
            </header>
            
            <nav class="tabs">
                <button class="tab-btn active" data-tab="debts">Долги</button>
                <button class="tab-btn" data-tab="payments">Платежи</button>
                <button class="tab-btn" data-tab="readings">Показания</button>
                <button class="tab-btn" data-tab="electric">Электро</button>
                <button class="tab-btn" data-tab="deadlines">Сроки</button>
            </nav>

            <div id="tab-content">
                <!-- Содержимое вкладок будет вставляться через JS -->
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
